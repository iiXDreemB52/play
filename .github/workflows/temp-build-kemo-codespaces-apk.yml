name: Temp Build Kemo Codespaces APK

on:
  push:
    branches:
      - temp-apk-builder-20260914
    paths:
      - 'android-builder/KemoCodespaces/**'
      - '.github/workflows/temp-build-kemo-codespaces-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-builder/KemoCodespaces/**'
      - '.github/workflows/temp-build-kemo-codespaces-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-builder/KemoCodespaces
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: cp android-builder/KemoCodespaces/app/build/outputs/apk/debug/app-debug.apk Kemo-Codespaces-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kemo-Codespaces-v1.0.0
          path: Kemo-Codespaces-v1.0.0.apk
          if-no-files-found: error
